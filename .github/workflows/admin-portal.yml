name: Deploy admin portal

# Build on every PR that touches this portal (a gate — no AWS access).
# Build AND deploy when an approved change lands on main.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/admin-portal/**'
      - '.github/workflows/admin-portal.yml'
  pull_request:
    paths:
      - 'frontend/admin-portal/**'
      - '.github/workflows/admin-portal.yml'
  workflow_dispatch:

# Supersede queued PR builds, but let a main deploy finish uninterrupted.
concurrency:
  group: admin-portal-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  id-token: write   # required to assume the AWS deploy role via OIDC
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/admin-portal
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/admin-portal/package-lock.json

      - run: npm ci

      - name: Build static export
        run: npm run build
        env:
          # NEXT_PUBLIC_* are baked into the bundle at build time.
          NEXT_PUBLIC_API_URL: ${{ vars.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_COGNITO_DOMAIN: ${{ vars.NEXT_PUBLIC_COGNITO_DOMAIN }}
          NEXT_PUBLIC_USER_POOL_ID: ${{ vars.NEXT_PUBLIC_USER_POOL_ID }}
          NEXT_PUBLIC_USER_POOL_CLIENT_ID: ${{ vars.NEXT_PUBLIC_USER_POOL_CLIENT_ID }}
          NEXT_PUBLIC_ADMIN_URL: ${{ vars.NEXT_PUBLIC_ADMIN_URL }}

      # --- Deploy: only for an approved change on main ---
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Sync to S3 and invalidate CloudFront
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          aws s3 sync out "s3://${{ vars.ADMIN_BUCKET }}" --delete
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.ADMIN_DISTRIBUTION_ID }}" \
            --paths "/*"
